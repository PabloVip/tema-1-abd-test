<style>

    margin: 0 auto 24px;
    background: var(--card);

    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 12px;

    color: var(--accent);

    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;

  .q .num { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .q .text { margin: 6px 0 14px; font-weight: 500; }

  label.opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    font-size: 0.95rem;

  label.opt:hover { background: #24344d; }

  .q.correct { border-color: var(--ok); }
  .q.correct .num::after { content: "  ✔"; color: var(--ok); }
  .q.wrong { border-color: var(--ko); }
  .q.wrong .num::after { content: "  ✘"; color: var(--ko); }

  label.opt.selected-ko { background: rgba(239,68,68,0.15); border-color: var(--ko); }

    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(148,163,184,0.1);
    border-radius: 8px;
    font-size: 0.88rem;

    font-weight: 600;

  #btnReiniciar { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  #resultado {

</style>

  let html = "";
  for (let c = 0; c < CATS.length; c++) {
    html += '<section class="cat"><div class="cat-title">' + CATS[c][0] + "</div>";
    QS.forEach((q, i) => {
      if (q.cat !== c) return;
      html += '<div class="q" id="q' + i + '">';
      html += '<div class="num">Pregunta ' + (i+1) + "/" + N + "</div>";
      html += '<div class="text">' + q.t + "</div>";
      html += '<div class="opts">';
      q.o.forEach((opt, j) => {
        html += '<label class="opt" data-q="' + i + '" data-opt="' + j + '">';
        html += '<input type="radio" name="q' + i + '" value="' + j + '">';
        html += '<span><b>' + LETRAS[j] + ")</b> " + opt + "</span></label>";
      });
      html += "</div>";
      if (q.e) html += '<div class="explain" id="exp' + i + '">' + q.e + "</div>";
      html += "</div>";
    });
    html += "</section>";
  }
  container.innerHTML = html;
  container.querySelectorAll("input[type=radio]").forEach(inp => {
    inp.addEventListener("change", () => {
      if (graded) return;
      const q = +inp.getAttribute("name").slice(1);
      answers[q] = +inp.value;
      updateProgress();
    });
  });
  updateProgress();
}

function updateProgress() {
  const done = answers.filter(a => a !== -1).length;
  document.getElementById("answered").textContent = done;
  document.getElementById("barFill").style.width = (done / N * 100) + "%";
}

function grade() {
  const btn = document.getElementById("btnCorregir");
  const sel = btn.textContent === "Mostrar soluciones" ? btn.textContent : "";

  if (!graded) {
    if (answers.includes(-1)) {
      if (!confirm("Hay preguntas sin responder. ¿Continuar?")) return;
    }
    btn.textContent = "Mostrar soluciones";
    btn.removeEventListener("click", arguments.callee);
    graded = true;
    let ok = 0, re = 0, mal = 0;
    QS.forEach((q, i) => {
      const card = document.getElementById("q" + i);
      const chosen = answers[i];
      if (chosen === q.c) { ok++; card.classList.add("correct"); }
      else { mal++; card.classList.add("wrong"); }
      card.querySelectorAll("label.opt").forEach(lbl => {
        const o = +lbl.getAttribute("data-opt");
        if (o === chosen && o === q.c) lbl.classList.add("selected-ok");
        else if (o === chosen) lbl.classList.add("selected-ko");
        else if (o === q.c) { lbl.classList.add("show-ok"); lbl.style.pointerEvents = "none"; }
      });
      card.querySelectorAll("input").forEach(inp => inp.disabled = true);
      const exp = document.getElementById("exp" + i);
      if (exp) exp.classList.add("show");
    });
    const pct = Math.round(ok / N * 100);
    document.getElementById("score").textContent = ok + "/" + N + " (" + pct + "%)";
    const res = document.getElementById("resultado");
    res.style.display = "block";
    if (pct >= 90) { res.className = "bien"; res.innerHTML = "Excelente: " + ok + "/" + N + " (" + pct + "%)<div class=\"sub\">Dominas el tema. Repasa solo lo fallado.</div>"; }
    else if (pct >= 70) { res.className = "aceptable"; res.innerHTML = "Bien: " + ok + "/" + N + " (" + pct + "%)<div class=\"sub\">Buen nivel, pero repasa las secciones con fallos.</div>"; }
    else { res.className = "mal"; res.innerHTML = "A estudiar: " + ok + "/" + N + " (" + pct + "%)<div class=\"sub\">Repite el test y repasa el material.</div>"; }
    window.scrollTo({top: 0, behavior: "smooth"});
  } else {
    btn.textContent = "Corregir test";
    graded = false;
    answers.fill(-1);
    document.getElementById("resultado").style.display = "none";
    document.getElementById("score").textContent = "—";
    render();
    document.getElementById("btnCorregir").addEventListener("click", grade, {once: false});
  }
}

document.getElementById("btnCorregir").addEventListener("click", grade);
document.getElementById("btnReiniciar").addEventListener("click", () => {
  if (!confirm("¿Reiniciar el test? Se perderán las respuestas.")) return;
  graded = false;
  answers.fill(-1);
  document.getElementById("btnCorregir").textContent = "Corregir test";
  document.getElementById("resultado").style.display = "none";
  document.getElementById("score").textContent = "—";
  render();
});

render();
</script>
</body>
</html>
